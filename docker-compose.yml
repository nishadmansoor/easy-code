services:
  qdrant:
    # Pinned for reproducibility. Qdrant cannot read storage written by a newer
    # version, so only ever raise this, never lower it, on an existing volume.
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    environment:
      NEO4J_AUTH: neo4j/easycode
      NEO4J_server_memory_heap_max__size: 1G
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Service names inside the compose network, overriding the localhost
      # defaults that apply when running the API directly on the host.
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: easycode
      DATABASE_URL: sqlite:////app/data/easycode.db
      REPOS_DIR: /app/data/repos
      # Ollama runs on the host, not in this network.
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  qdrant_data:
  neo4j_data:
