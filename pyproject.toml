[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easycode"
version = "1.0.0"
description = "AI-powered codebase understanding: semantic retrieval + a structural code graph"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "qdrant-client>=1.7.0",
    "neo4j>=5.14.0",
    "sentence-transformers>=2.2.0",
    "gitpython>=3.1.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]
# PostgreSQL instead of the default SQLite metadata store.
postgres = ["psycopg[binary]>=3.1.0"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["backend/tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
markers = [
    "integration: requires Qdrant and/or Neo4j to be running",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]
